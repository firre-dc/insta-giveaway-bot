[project]
name = "insta-bot"
version = "0.1.0"
description = "Instagram comment tooling"
readme = "README.md"
authors = [
    { name = "Firre De Clippel"}
]
requires-python = ">=3.12"
dependencies = [
    "instagrapi>=3.2.19",
    "python-dotenv>=1.2.4",
]

[project.scripts]
insta-bot = "insta_bot.comment:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
